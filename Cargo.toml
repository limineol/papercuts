[package]
name = "papercuts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Papercut incident reports for coding agents"
license = "MIT"
repository = "https://github.com/limineol/papercuts"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
jiff = { version = "=1.0.0", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
